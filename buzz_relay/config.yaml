# Buzz Relay HA Add-on
# A Nostr-based collaboration workspace for humans and AI agents
# https://github.com/block/buzz
name: Buzz Relay
version: "0.6.5"
slug: buzz_relay
description: Block's Buzz relay — a Nostr-based workspace where humans and AI agents collaborate in shared channels
url: https://github.com/chillkiller/buzz-ha-addon
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
hassio_api: false
homeassistant_api: false
host_network: true
stage: experimental
timeout: 120
backup: cold
apparmor: false

# Home Assistant Ingress — Buzz Web-UI inside the HA Companion App
ingress: true
ingress_port: 3000
ingress_stream: true
panel_title: Buzz Relay
panel_icon: mdi:bee

# Health monitoring
watchdog: http://[HOST]:3000/health

map:
  - addon_config:rw
  - share:rw

options:
  timezone: "Europe/Berlin"

  # Relay identity — a 64-character hex Nostr private key.
  # Leave empty to auto-generate on first boot.
  relay_private_key: ""

  # Owner identity — 64-character hex Nostr pubkey.
  # Required only for closed relay mode (require_relay_membership: true).
  relay_owner_pubkey: ""

  # Relay settings
  require_auth_token: false
  require_relay_membership: false
  allow_nip_oa_auth: true
  auto_migrate: true

  # Database (auto-generated if empty)
  postgres_password: ""

  # Redis (auto-generated if empty)
  redis_password: ""

  # S3 / MinIO storage (auto-generated if empty)
  s3_access_key: ""
  s3_secret_key: ""

  # Logging
  rust_log: "buzz_relay=info,buzz_db=info,buzz_auth=info,buzz_pubsub=info,tower_http=info"

schema:
  timezone: str
  relay_private_key: str?
  relay_owner_pubkey: str?
  require_auth_token: bool?
  require_relay_membership: bool?
  allow_nip_oa_auth: bool?
  auto_migrate: bool?
  postgres_password: str?
  redis_password: str?
  s3_access_key: str?
  s3_secret_key: str?
  rust_log: str?